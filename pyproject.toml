[project]
name = "rag"
version = "0.1.0"
description = "Self-healing RAG pipeline with bounded deterministic recovery and chaos testing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-google-genai>=3.2.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langsmith>=0.14.12",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "tenacity>=9.2.1",
    "torch>=2.14.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line length violations (handled by ruff format)
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Option",
    "typer.Argument",
    "fastapi.Depends",
    "fastapi.Query",
    "pathlib.Path",
    "Path",
]



[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "rank_bm25.*",
    "sentence_transformers.*",
    "ragas.*",
    "datasets.*",
    "streamlit.*",
    "pypdf.*",
    "bs4.*",
    "google.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src/rag --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src", "."]


[tool.coverage.run]
source = ["src/rag"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
