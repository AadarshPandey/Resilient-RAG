services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_TARGET: cpu
    container_name: rag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - RAG_QDRANT_URL=http://qdrant:6333
      - RAG_CHECKPOINT_DSN=sqlite:///app/data/checkpoints.db
      - RAG_DEVICE=cpu
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_DSN=postgresql://rag:rag@postgres:5432/rag
      - RAG_LLM_CHAIN=google:gemini-2.5-flash,google:gemini-2.5-pro
    volumes:
      - rag_data:/app/data
      - model_cache:/home/appuser/.cache
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  rag_data:
  model_cache:
  qdrant_storage:
  postgres_data:
  redis_data:

networks:
  default:
    name: rag_network
